<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="top">
    <div class="row">
      <input type="text" id="filter" placeholder="搜索 LUT…" />
      <button id="btnFolder" class="ibtn" title="选择 LUT 文件夹（按住 Alt 点击：恢复为 PS 自带）"><img src="icons/folder.svg" width="14" height="14" /></button>
    </div>
    <div class="row">
      <button id="btnAutoRefresh" class="ibtn on" title="切换到另一张照片时，自动更新预览">换图自动刷新</button>
      <button id="btnRefresh" class="ibtn" title="按当前画面重新生成预览">↻ 刷新</button>
    </div>

    <div class="row">
      <label class="lbl">强度</label>
      <input type="range" id="intensity" min="0" max="100" value="100" />
      <span id="intensityVal" class="val">100%</span>
    </div>

    <div class="row">
      <label class="lbl">大小</label>
      <input type="range" id="tileSize" min="90" max="300" value="130" />
      <span id="tileSizeVal" class="val">130</span>
    </div>
  </div>

  <div id="scroll">
    <div id="grid"></div>
  </div>
  <div id="status" class="status">正在查找 LUT…</div>

  <script src="index.js"></script>
</body>
</html>
